
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Dashboard</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<body>

    <!-- Contenedor principal de la página -->
    <main class="min-h-screen bg-[#f8fafc]">

        <!-- Contenedor del dashboard -->
        <section class="mx-auto max-w-[1500px] px-8 py-10">

            <!-- Encabezado -->
            <header class="mb-6">
                <h1 class="text-2xl font-bold text-gray-900">
                    Dashboard
                </h1>

                <p class="text-sm text-gray-500">
                    Bienvenido de nuevo, admin.
                </p>
            </header>

<!-- Tarjetas de estadísticas -->
<div class="grid grid-cols-4 gap-6 mb-8">

    <!-- Tarjeta 1 -->
    <div class="bg-white p-6 rounded-xl shadow-sm">
        <p class="text-sm text-gray-500">Usuarios totales</p>
        <h2 class="text-2xl font-bold text-gray-800 mt-2">12,450</h2>
        <p class="text-sm text-green-500 mt-2">+12.5% respecto al mes pasado</p>
    </div>

    <!-- Tarjeta 2 -->
    <div class="bg-white p-6 rounded-xl shadow-sm">
        <p class="text-sm text-gray-500">Ingresos</p>
        <h2 class="text-2xl font-bold text-gray-800 mt-2">$48,250</h2>
        <p class="text-sm text-green-500 mt-2">+8.2% respecto al mes pasado</p>
    </div>

    <!-- Tarjeta 3 -->
    <div class="bg-white p-6 rounded-xl shadow-sm">
        <p class="text-sm text-gray-500">Sesiones activas</p>
        <h2 class="text-2xl font-bold text-gray-800 mt-2">2,340</h2>
        <p class="text-sm text-green-500 mt-2">+5.7% respecto al mes pasado</p>
    </div>

    <!-- Tarjeta 4 -->
    <div class="bg-white p-6 rounded-xl shadow-sm">
        <p class="text-sm text-gray-500">Tasa de conversión</p>
        <h2 class="text-2xl font-bold text-gray-800 mt-2">3.6%</h2>
        <p class="text-sm text-green-500 mt-2">+2.1% respecto al mes pasado</p>
    </div>

</div>
<!-- Sección de gráficas -->
<div class="grid grid-cols-2 gap-6">

    <!-- Panel de gráfica de líneas -->
    <div class="bg-white p-6 rounded-xl shadow-sm">

        <h2 class="text-lg font-bold text-gray-800 mb-4">
            Usuarios registrados
        </h2>

        <div class="relative h-96">
            <canvas id="lineChart"></canvas>
        </div>

    </div>

    <!-- Panel de gráfica de barras -->
    <div class="bg-white p-6 rounded-xl shadow-sm">

        <h2 class="text-lg font-bold text-gray-800 mb-4">
            Ingresos mensuales
        </h2>

        <div class="relative h-80">
            <canvas id="barChart"></canvas>
        </div>

    </div>

</div>
        </section>
    </main>
    </section>

</main>

<!-- Aquí comienza JavaScript de Chart.js -->

    <script>
    // Datos para la gráfica de línea
    const lineCtx = document.getElementById('lineChart').getContext('2d');
    const lineChart = new Chart(lineCtx, {
      type: 'line',
      data: {
        labels: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
        datasets: [{
          label: 'Usuarios 2024',
          data: [5000, 5500, 6000, 6200, 6800, 7200, 7500, 8000, 8249, 8500, 8800, 9100],
          borderColor: 'rgb(59, 130, 246)',
          backgroundColor: 'rgba(59, 130, 246, 0.1)',
          tension: 0.3,
          fill: true
        }, {
          label: 'Usuarios 2023',
          data: [4000, 4200, 4500, 4800, 5100, 5400, 5600, 5900, 6200, 6500, 6800, 7000],
          borderColor: 'rgb(107, 114, 128)',
          backgroundColor: 'rgba(107, 114, 128, 0.1)',
          tension: 0.3,
          fill: true
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'top',
          }
        },
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });

    // Datos para la gráfica de barras
    const barCtx = document.getElementById('barChart').getContext('2d');
    const barChart = new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
        datasets: [{
          label: 'Ingresos 2024 ($)',
          data: [15000, 16500, 18000, 19500, 21000, 22500, 23000, 24000, 24780, 26000, 27500, 29000],
          backgroundColor: 'rgba(59, 130, 246, 0.8)'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'top',
          }
        },
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  </script>


</body>
</html>
</body>



</body>

</html>
